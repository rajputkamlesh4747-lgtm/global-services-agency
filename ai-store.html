<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Store | Global Services Agency</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#111;
    color:#fff;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

h1{
    color:#00d4ff;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:40px;
}

.card{
    width:300px;
    background:#1b1b1b;
    border-radius:10px;
    padding:20px;
    text-align:center;
}

.card h2{
    color:#00d4ff;
}

.price{
    font-size:28px;
    color:#00ff99;
    margin:15px 0;
}

button{
    background:#00d4ff;
    color:#000;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>AI Store</h1>
<p>Premium AI Digital Products</p>
</header>

<section class="products">

<div class="card">
<h2>1000 ChatGPT Prompts</h2>
<p>Business, Marketing & AI Prompt Collection.</p>
<div class="price">₹499</div>
<button>Buy Now</button>
</div>

<div class="card">
<h2>Website Templates</h2>
<p>Professional HTML Website Templates.</p>
<div class="price">₹999</div>
<button>Buy Now</button>
</div>

<div class="card">
<h2>AI Automation Kit</h2>
<p>Ready-to-use AI business automation files.</p>
<div class="price">₹1999</div>
<button>Buy Now</button>
</div>

</section>

</body>
</html>
